name: Ping Render App

on:
  schedule:
    - cron: '*/30 * * * *'  # 매 30분마다 실행 (UTC 기준)
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  ping-job:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render URL
        run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://milseongson.onrender.com/api/ping
